<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>티백 OEM 일정관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* 레이아웃: 상단 요약 4칸 → 보기 전환/필터 막대 → 본문(달력·타임라인·목록) → 우측 상세 패널(모바일은 하단 시트)
   색: 공정 단계마다 고정색(로스팅 호박 / 입고 파랑 / 분쇄마감 적색 / 생산 녹색 / 디게싱 모래), 기타 일정은 보라·청록·회청·분홍 */
:root{
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --bg:#f2f5f1; --surface:#ffffff; --surface2:#f7f9f6; --ink:#18211d; --ink2:#4b5851; --ink3:#78847d;
  --line:#dce3dc; --line2:#e9eee9; --accent:#1d6b53; --accent-ink:#ffffff; --accent-soft:#dcefe6;
  --warn:#b3261e; --warn-bg:#fbe4e1; --shadow:0 10px 30px rgba(20,40,30,.14);
  --roast-bg:#fbe9d2; --roast-fg:#80440a; --roast-dot:#d9822b;
  --recv-bg:#dcebfb;  --recv-fg:#1b4a82;  --recv-dot:#2f78c9;
  --grind-bg:#fadcd8; --grind-fg:#922619; --grind-dot:#d0473a;
  --prod-bg:#d9efe4;  --prod-fg:#12553c;  --prod-dot:#1f8a63;
  --degas-bg:#eee7da; --degas-fg:#675b48; --degas-dot:#b5a68a;
  --meet-bg:#e9e1fa;  --meet-fg:#4b3790;  --meet-dot:#7a5fd0;
  --deliv-bg:#d6eff0; --deliv-fg:#16545a; --deliv-dot:#25989c;
  --mat-bg:#e2e8f0;   --mat-fg:#37465c;   --mat-dot:#66768f;
  --qc-bg:#fbdfee;    --qc-fg:#862461;    --qc-dot:#cf4b97;
  --etc-bg:#e8ebe7;   --etc-fg:#4b5851;   --etc-dot:#8a948c;
  --i0-bg:#fde8cf; --i0-fg:#7a3f06; --i0-dot:#e0872a; --i0-solid:#c96d12; --i0-on:#ffffff;
  --i1-bg:#d3efe6; --i1-fg:#0f5a45; --i1-dot:#1f9c78; --i1-solid:#17806a; --i1-on:#ffffff;
  --i2-bg:#e3e1fb; --i2-fg:#3f3896; --i2-dot:#6a60d8; --i2-solid:#5a50c8; --i2-on:#ffffff;
  --i3-bg:#fbdde6; --i3-fg:#8a2347; --i3-dot:#d84a7b; --i3-solid:#c0305f; --i3-on:#ffffff;
  --i4-bg:#d9e8fb; --i4-fg:#1b4a82; --i4-dot:#2f78c9; --i4-solid:#2468b8; --i4-on:#ffffff;
  --i5-bg:#efecc6; --i5-fg:#5c5710; --i5-dot:#b0a32a; --i5-solid:#8f8420; --i5-on:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#181f1b; --surface2:#1d2520; --ink:#e6ece8; --ink2:#aab6ae; --ink3:#7f8c84;
  --line:#2c362f; --line2:#232c26; --accent:#52c69d; --accent-ink:#0c1a14; --accent-soft:#163428;
  --warn:#ff8f84; --warn-bg:#40201d; --shadow:0 10px 30px rgba(0,0,0,.5);
  --roast-bg:#3b2a16; --roast-fg:#f0b878; --roast-dot:#e0933f;
  --recv-bg:#17304d;  --recv-fg:#9cc6f2;  --recv-dot:#4a93e0;
  --grind-bg:#3f1f1b; --grind-fg:#f2a398; --grind-dot:#e0604f;
  --prod-bg:#15372b;  --prod-fg:#8fdcb9;  --prod-dot:#35b283;
  --degas-bg:#2c2a24; --degas-fg:#bdb29b; --degas-dot:#8c8068;
  --meet-bg:#2b2447;  --meet-fg:#c4b3f2;  --meet-dot:#8c72e0;
  --deliv-bg:#123436; --deliv-fg:#86d4d6; --deliv-dot:#36b3b7;
  --mat-bg:#232b38;   --mat-fg:#aab9d0;   --mat-dot:#7b8ca8;
  --qc-bg:#3d1b30;    --qc-fg:#f0a6d0;    --qc-dot:#db62a8;
  --etc-bg:#262c28;   --etc-fg:#aab6ae;   --etc-dot:#7f8c84;
  --i0-bg:#3d2a12; --i0-fg:#f5bd7d; --i0-dot:#d07a22; --i0-solid:#f0a255; --i0-on:#1b1206;
  --i1-bg:#12382d; --i1-fg:#8fe0c3; --i1-dot:#22a07c; --i1-solid:#4cc9a2; --i1-on:#06180f;
  --i2-bg:#28244d; --i2-fg:#c3bdf6; --i2-dot:#7d74e4; --i2-solid:#9a92f0; --i2-on:#12102e;
  --i3-bg:#411a2a; --i3-fg:#f4a8c1; --i3-dot:#e0618b; --i3-solid:#ec7da0; --i3-on:#2a0b17;
  --i4-bg:#17304d; --i4-fg:#9cc6f2; --i4-dot:#4a93e0; --i4-solid:#6aa9ea; --i4-on:#08182c;
  --i5-bg:#353110; --i5-fg:#dfd57c; --i5-dot:#c4b53a; --i5-solid:#d3c44c; --i5-on:#211e05;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#181f1b; --surface2:#1d2520; --ink:#e6ece8; --ink2:#aab6ae; --ink3:#7f8c84;
  --line:#2c362f; --line2:#232c26; --accent:#52c69d; --accent-ink:#0c1a14; --accent-soft:#163428;
  --warn:#ff8f84; --warn-bg:#40201d; --shadow:0 10px 30px rgba(0,0,0,.5);
  --roast-bg:#3b2a16; --roast-fg:#f0b878; --roast-dot:#e0933f;
  --recv-bg:#17304d;  --recv-fg:#9cc6f2;  --recv-dot:#4a93e0;
  --grind-bg:#3f1f1b; --grind-fg:#f2a398; --grind-dot:#e0604f;
  --prod-bg:#15372b;  --prod-fg:#8fdcb9;  --prod-dot:#35b283;
  --degas-bg:#2c2a24; --degas-fg:#bdb29b; --degas-dot:#8c8068;
  --meet-bg:#2b2447;  --meet-fg:#c4b3f2;  --meet-dot:#8c72e0;
  --deliv-bg:#123436; --deliv-fg:#86d4d6; --deliv-dot:#36b3b7;
  --mat-bg:#232b38;   --mat-fg:#aab9d0;   --mat-dot:#7b8ca8;
  --qc-bg:#3d1b30;    --qc-fg:#f0a6d0;    --qc-dot:#db62a8;
  --etc-bg:#262c28;   --etc-fg:#aab6ae;   --etc-dot:#7f8c84;
  --i0-bg:#3d2a12; --i0-fg:#f5bd7d; --i0-dot:#d07a22; --i0-solid:#f0a255; --i0-on:#1b1206;
  --i1-bg:#12382d; --i1-fg:#8fe0c3; --i1-dot:#22a07c; --i1-solid:#4cc9a2; --i1-on:#06180f;
  --i2-bg:#28244d; --i2-fg:#c3bdf6; --i2-dot:#7d74e4; --i2-solid:#9a92f0; --i2-on:#12102e;
  --i3-bg:#411a2a; --i3-fg:#f4a8c1; --i3-dot:#e0618b; --i3-solid:#ec7da0; --i3-on:#2a0b17;
  --i4-bg:#17304d; --i4-fg:#9cc6f2; --i4-dot:#4a93e0; --i4-solid:#6aa9ea; --i4-on:#08182c;
  --i5-bg:#353110; --i5-fg:#dfd57c; --i5-dot:#c4b53a; --i5-solid:#d3c44c; --i5-on:#211e05;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:2560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.num{font-variant-numeric:tabular-nums}

.t-roast{--c-bg:var(--roast-bg);--c-fg:var(--roast-fg);--c-dot:var(--roast-dot)}
.t-recv{--c-bg:var(--recv-bg);--c-fg:var(--recv-fg);--c-dot:var(--recv-dot)}
.t-grind{--c-bg:var(--grind-bg);--c-fg:var(--grind-fg);--c-dot:var(--grind-dot)}
.t-prod{--c-bg:var(--prod-bg);--c-fg:var(--prod-fg);--c-dot:var(--prod-dot)}
.t-degas{--c-bg:var(--degas-bg);--c-fg:var(--degas-fg);--c-dot:var(--degas-dot)}
.t-meet{--c-bg:var(--meet-bg);--c-fg:var(--meet-fg);--c-dot:var(--meet-dot)}
.t-deliv{--c-bg:var(--deliv-bg);--c-fg:var(--deliv-fg);--c-dot:var(--deliv-dot)}
.t-mat{--c-bg:var(--mat-bg);--c-fg:var(--mat-fg);--c-dot:var(--mat-dot)}
.t-qc{--c-bg:var(--qc-bg);--c-fg:var(--qc-fg);--c-dot:var(--qc-dot)}
.t-etc{--c-bg:var(--etc-bg);--c-fg:var(--etc-fg);--c-dot:var(--etc-dot)}

/* 머리글 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.top h1{font-size:22px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sub{margin:2px 0 0;color:var(--ink2);font-size:13px}
.top .rules{margin:6px 0 0;color:var(--ink3);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;font-size:13px;min-height:36px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.btn.sm{padding:4px 9px;min-height:30px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}

/* 요약 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left}
button.tile:hover{background:var(--surface2)}
.tile .k{font-size:12px;color:var(--ink3);font-weight:500}
.tile .v{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.tile .v small{font-size:12.5px;font-weight:500;color:var(--ink2);margin-left:6px}
.tile .s{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--prod-dot);border-radius:3px}
.tile.warn .v{color:var(--warn)}

/* 도구 막대 */
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:500;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.nav{display:inline-flex;align-items:center;gap:6px}
.nav h2{margin:0 6px;font-size:17px;font-weight:700;min-width:7.5em;text-align:center}
.nav .btn{padding:4px 10px}
.filters{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;color:var(--ink2)}
.fchip .dot{width:9px;height:9px;border-radius:50%;background:var(--c-dot,var(--ink3))}
.fchip[aria-pressed="false"]{opacity:.45}
.fchip[aria-pressed="false"] .dot{background:var(--line)}
.fchip.item[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);padding-left:10px}
.fchip.item[aria-pressed="false"]{opacity:1}
.sep{width:1px;height:20px;background:var(--line)}


.i0{--ib:var(--i0-bg);--if:var(--i0-fg);--id:var(--i0-dot);--is:var(--i0-solid);--on:var(--i0-on)}
.i1{--ib:var(--i1-bg);--if:var(--i1-fg);--id:var(--i1-dot);--is:var(--i1-solid);--on:var(--i1-on)}
.i2{--ib:var(--i2-bg);--if:var(--i2-fg);--id:var(--i2-dot);--is:var(--i2-solid);--on:var(--i2-on)}
.i3{--ib:var(--i3-bg);--if:var(--i3-fg);--id:var(--i3-dot);--is:var(--i3-solid);--on:var(--i3-on)}
.i4{--ib:var(--i4-bg);--if:var(--i4-fg);--id:var(--i4-dot);--is:var(--i4-solid);--on:var(--i4-on)}
.i5{--ib:var(--i5-bg);--if:var(--i5-fg);--id:var(--i5-dot);--is:var(--i5-solid);--on:var(--i5-on)}
.ev{--ib:var(--etc-bg);--if:var(--etc-fg);--id:var(--etc-dot);--c-bg:var(--etc-bg);--c-fg:var(--etc-fg);--c-dot:var(--etc-dot)}
.sw{width:12px;height:12px;border-radius:3px;background:var(--id);display:inline-block;flex:none}
.fchip.item:not(.all){background:var(--ib);color:var(--if);border-color:transparent;padding-left:9px}
.fchip.item:not(.all) .dot{background:var(--id)}
.fchip.item[aria-pressed="true"]:not(.all){box-shadow:0 0 0 2px var(--id)}
.fchip.proc[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.hint.lab{font-weight:700}
.row.ic{border-left:4px solid var(--id)}
.itemcard.ic{border-left:5px solid var(--id);background:var(--ib)}
.itemcard.ic b{color:var(--if)}
.grp td{background:var(--ib);color:var(--if);font-weight:700;border-bottom:1px solid var(--line)}
.grp td .sw{margin-right:8px;vertical-align:-1px}
.grp td em{font-style:normal;font-weight:500;margin-left:10px;opacity:.85}
tr.ic td:first-child{box-shadow:inset 4px 0 0 var(--id)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:2px}
.lt{font-size:12px;font-weight:700;color:var(--ink3)}
.lgi{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2)}
.sw2{width:28px;height:16px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-style:normal;position:relative}
.tg2{background:var(--ink);color:var(--bg);font-size:9.5px;font-weight:700;border-radius:3px;padding:0 4px;font-style:normal;line-height:14px}
.sepv{width:1px;height:16px;background:var(--line)}
.gg{grid-column:1/-1;background:var(--ib);color:var(--if);padding:6px 0;border-bottom:1px solid var(--line)}
.ggi{position:sticky;left:12px;display:inline-flex;align-items:center;gap:8px;font-size:13px}
.ggi em{font-style:normal;font-size:12px;opacity:.85}
.gl.ic{box-shadow:inset 5px 0 0 var(--id);padding-left:14px}
.chip.ev{background:var(--surface);border:1px dashed var(--ink3);border-left:3px solid var(--ink2);color:var(--ink)}
.chip.ev small{opacity:.7}

.atools{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.atools .f{min-width:130px}
.atools .f.grow{flex:1;min-width:200px}
table.pivot{min-width:560px}
.pivot th.r .sw{vertical-align:-1px}
.pivot tr[data-a] td b{color:var(--accent)}
.pivot tr.tot td{font-weight:700;background:var(--surface2);border-top:2px solid var(--line)}
.seg{flex-wrap:wrap}
.seg.sm button{padding:4px 11px;font-size:12.5px}
.chartbox{position:relative}
.chartscroll{overflow-x:auto}
.chart{display:block;width:100%;min-width:620px;height:auto}
.chart .ax{fill:var(--ink3);font-size:10px;font-family:var(--font)}
.chart .ax.td{fill:var(--accent);font-weight:700}
.chart .grid{stroke:var(--line2);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .capl{stroke:var(--ink2);stroke-dasharray:5 4;stroke-width:1.5}
.chart .capt{fill:var(--ink2);font-size:10.5px;font-weight:700;font-family:var(--font)}
.chart .bseg{fill:var(--id);stroke:var(--surface);stroke-width:1}
.chart .wk{fill:var(--surface2)}
.chart .ovt{fill:var(--warn);font-size:10px;font-weight:700;font-family:var(--font)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:color-mix(in srgb,var(--ink) 6%,transparent)}
.ctip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;z-index:5;min-width:170px}
.ctip b{display:block;margin-bottom:4px}
.ctip .tr{display:flex;justify-content:space-between;gap:14px;align-items:center}
.ctip .tr span{display:inline-flex;align-items:center;gap:6px}
.ctip .tr.tt{border-top:1px solid var(--line2);margin-top:4px;padding-top:4px;font-weight:700}
.okpill,.badpill,.unsetpill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.okpill{background:var(--accent-soft);color:var(--accent)}
.badpill{background:var(--warn-bg);color:var(--warn)}
.unsetpill{background:var(--surface2);color:var(--ink2);border:1px dashed var(--ink3)}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:2px;min-width:0}
.kv .k{font-size:12px;color:var(--ink3)}
.kv .v{font-size:17px;font-weight:700}
.kv .v small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:4px}
.kv.bad{background:var(--warn-bg)}
.kv.bad .v{color:var(--warn)}
.simform{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.simform .f{min-width:150px}
.simform .f.grow{flex:1;min-width:200px}
.mini{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;vertical-align:middle;margin-left:8px}
.mini i{display:block;height:100%;background:var(--accent)}
.mini i.over{background:var(--warn)}
.mini i.new{background:var(--id,var(--accent))}
.perrow{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--id);border-radius:8px;padding:6px 8px 6px 10px;background:var(--surface)}
.perrow span{display:flex;gap:7px;align-items:center;min-width:0;font-size:13px}
.perrow input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;width:100%;min-width:0}
.shiprow{display:grid;grid-template-columns:1fr 1fr 1.3fr auto;gap:6px;align-items:center}
.shiprow input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:13px;min-width:0;width:100%}
.matsub{display:block;font-size:11.5px;color:var(--ink2)}
tr.tot td{font-weight:700;background:var(--surface2)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.two>*{min-width:0}
@media (max-width:720px){.two{grid-template-columns:minmax(0,1fr)}.shiprow{grid-template-columns:1fr 1fr auto}.shiprow input[data-sk=memo]{grid-column:1/-1;order:3}}
.sbars{display:flex;flex-direction:column;gap:6px}
.sbar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) minmax(0,auto);gap:6px 14px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 12px;text-align:left;width:100%}
.sbar:hover{background:var(--surface2)}
.sbar .sn b{display:block;font-size:13px}
.sbar .sn small{font-size:11.5px;color:var(--ink3)}
.sbar .st{position:relative;height:14px;border-radius:4px;background:var(--line2);overflow:hidden}
.sbar .st i{position:absolute;top:0;bottom:0;display:block}
.sbar .st .s1{left:0;background:var(--accent);border-radius:4px 0 0 4px}

.ocard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.oh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.otitle{border:0;background:transparent;padding:0;font-size:14.5px;text-align:left}
.otitle:hover b{text-decoration:underline}
.olines{display:flex;flex-direction:column;gap:8px}

.oline .on{display:flex;gap:7px;align-items:center;font-size:13px;min-width:0}
.oline .ot{position:relative;height:14px;border-radius:4px;background:var(--line2);overflow:hidden}
.oline .ot i{position:absolute;top:0;bottom:0;left:0;display:block}
.oline .ot .p{background:color-mix(in srgb,var(--ink3) 45%,var(--surface))}
.oline .ot .r{background:var(--id)}
.oline .ot .mk{width:3px;background:var(--ink);margin-left:-1px}
.oline .ov{grid-column:2;font-size:12px;color:var(--ink2)}
.logrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface2)}
.logrow input,.logrow select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 7px;font-size:12.5px;min-width:0;width:100%}
.mvrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
.mvrow.c{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}
.mvrow span b{display:block;font-size:13px}
.mvrow span small{font-size:11.5px;color:var(--ink3)}
.mvrow input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
@media (max-width:720px){.sbar{grid-template-columns:minmax(0,1fr)}.sbar .sv{align-items:flex-start;text-align:left}.oline{grid-template-columns:minmax(0,1fr)}.oline .ov{grid-column:1}.logrow{grid-template-columns:1fr 1fr}.mvrow.c{grid-template-columns:1fr 1fr}.mvrow.c span{grid-column:1/-1}}
.gnav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.gnav button{border:0;background:transparent;padding:10px 18px;font-size:15px;font-weight:500;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.gnav button:hover{color:var(--ink)}
.gnav button[aria-current="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.gdot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.subnav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg .cnt{font-size:11px;opacity:.7;margin-left:2px}
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.strip b{color:var(--ink);font-weight:700}
.strip .bad b{color:var(--warn)}
.code{font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink2)}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.bcard{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;text-align:left;min-width:0}
.bcard:hover{background:var(--surface2)}
.bcard.off{opacity:.55}
.bcard .bh{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bcard .bh b{font-size:15px;margin-right:2px}
.bcard .bits{display:flex;flex-wrap:wrap;gap:4px}
.ichip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--ib);color:var(--if);border-radius:999px;padding:1px 8px}
.ichip .sw{width:8px;height:8px}
.bcard .brows{display:flex;flex-direction:column;gap:3px;font-size:12.5px;border-top:1px solid var(--line2);padding-top:7px}
.bcard .brows>span{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bcard .brows em{font-style:normal;color:var(--ink3);flex:none}
.md{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:14px;align-items:start}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;position:sticky;top:12px;max-height:80vh;overflow:auto}
.mgh{font-size:11.5px;font-weight:700;color:var(--ink3);padding:8px 8px 3px;letter-spacing:.04em}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-radius:8px;background:transparent;padding:8px 10px;text-align:left;width:100%}
.mitem:hover{background:var(--surface2)}
.mitem.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mitem .mn{min-width:0}
.mitem .mn b{display:block;font-size:13px;font-weight:600}
.mitem .mn small{font-size:11.5px;color:var(--ink3)}
.mitem .badpill,.mitem .okpill,.mitem .unsetpill{font-size:11px;padding:0 7px}
.mdetail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.dh3{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.dh3 h3{margin:4px 0 2px;font-size:18px}
.pchart{display:block;width:100%;height:auto}
.pchart .ax{fill:var(--ink3);font-size:10.5px;font-family:var(--font)}
.pchart .ax.td{fill:var(--accent);font-weight:700}
.pchart .grid{stroke:var(--line2)}
.pchart .neg{fill:var(--warn-bg)}
.pchart .tline{stroke:var(--accent);stroke-dasharray:3 3}
.pchart .pline{fill:none;stroke:var(--accent);stroke-width:2}
.pchart .sdot{fill:var(--warn);stroke:var(--surface);stroke-width:2}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.fold>summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.fold>summary::before{content:"▸";color:var(--ink3);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
.foldin{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
@media (max-width:900px){.md{grid-template-columns:minmax(0,1fr)}.mlist{position:static;max-height:none}}
@media (max-width:720px){.gnav button{padding:10px 11px;font-size:14px}}
.calcin{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.cprod{border:1px solid var(--line);border-left:5px solid var(--id);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.cpn{display:flex;align-items:center;gap:8px}
.cpn b{flex:1;font-size:15px;color:var(--if)}
.cpc{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cpc .ichip{background:var(--surface2);color:var(--ink2)}
.cpq{display:flex;align-items:center;gap:8px}
.cpq input{flex:1;min-width:0;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);text-align:right}
.cpq input:focus{border-color:var(--accent)}
.cpq span{font-size:14px;color:var(--ink2)}
.calcopt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.calcres{display:flex;flex-direction:column;gap:14px}
.misspanel{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.misspanel .row .b{color:var(--warn)}
.syncbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.syncbar .sd{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.syncbar.run .sd{background:var(--ink3);animation:pulse 1s infinite alternate}
.syncbar.err{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.syncbar.err .sd{background:var(--warn)}
.syncbar .st2{flex:1;min-width:200px;font-size:13px}
.syncbar .st2 small{display:block;font-size:12px;color:var(--ink2)}
.syncbar.err .st2 small{color:var(--warn)}
.syncbar a.btn{text-decoration:none;color:var(--ink)}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.syncbar.run .sd{animation:none}}
.lnote{min-width:200px;white-space:normal}
.lnote .ln{display:block;font-size:12.5px;color:var(--ink)}
.lnote small{display:block;font-size:11.5px;color:var(--ink3)}
.lbtn{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:1px 8px;font-size:11.5px;color:var(--ink2);margin-top:2px}
.lbtn:hover{border-color:var(--accent);color:var(--accent)}
.lbtn.need{border-color:var(--warn);color:var(--warn);font-weight:700}
/* 월 달력 */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dowrow,.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dowrow div{padding:8px 10px;font-size:12px;font-weight:700;color:var(--ink2);background:var(--surface2);border-bottom:1px solid var(--line)}
.dowrow div:nth-child(6),.dowrow div:nth-child(7){color:var(--ink3)}
.dowrow div:nth-child(7){color:var(--grind-fg)}
.day{min-height:170px;padding:6px 6px 8px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;background:var(--surface)}
.day:nth-child(7n){border-right:0}
.day.we{background:var(--surface2)}
.day.out .dn{color:var(--ink3)}
.day.out{opacity:.72}
.day:hover{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.day .dh{display:flex;align-items:center;gap:6px;min-height:22px}
.dn{font-size:13px;font-weight:700;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px;padding:0 4px}
.day.today .dn{background:var(--accent);color:var(--accent-ink)}
.day .hol{font-size:11px;color:var(--grind-fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.holi .dn{color:var(--grind-fg)}
.day.today.holi .dn{color:var(--accent-ink)}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:flex;flex-direction:column;background:var(--ib);color:var(--if);border-radius:6px;padding:3px 7px;font-size:11.5px;line-height:1.35;min-width:0;border-left:4px solid var(--id)}
.chip b,.chip em,.chip small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{font-weight:700}
.chip b+em{display:inline}
.chip .l1{display:flex;gap:5px;min-width:0}
.chip .l1 b{flex:none}
.chip .l1 em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip small{font-size:10.5px;opacity:.8}
.chip.fill{background:linear-gradient(90deg,color-mix(in srgb,var(--id) 40%,var(--ib)) var(--fill),var(--ib) var(--fill))}
.chip.done{opacity:.55;text-decoration:line-through}
.more{font-size:11.5px;color:var(--ink2);padding:0 4px;font-weight:500}
.degasnote{font-size:11px;color:var(--degas-fg);padding:0 4px;margin-top:auto}
.mdots{display:none}
.flagmark{font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 5px;margin-left:auto}

/* 타임라인 */
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:78vh;--lw:220px;--cw:50px}
.gantt{display:grid;grid-template-columns:var(--lw) repeat(var(--n),var(--cw));width:max-content;min-width:100%}
.gantt>*{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);min-width:0}
.gl{position:sticky;left:0;z-index:2;background:var(--surface);padding:5px 10px;display:flex;flex-direction:column;justify-content:center;min-height:42px;text-align:left;border:0;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);font-size:12.5px;cursor:pointer}
.gl:hover{background:var(--surface2)}
.gl b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl span{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh{position:sticky;top:0;z-index:3;background:var(--surface2);text-align:center;font-size:11.5px;padding:4px 0;cursor:pointer}
.gh.mh{top:0;text-align:left;padding:5px 8px;font-weight:700;font-size:12.5px;cursor:default}
.gh.dh2{top:28px}
.gh .w{display:block;font-size:10.5px;color:var(--ink3)}
.gh.we{color:var(--ink3)}
.gh.sun .w,.gh.hol .w,.gh.hol{color:var(--grind-fg)}
.gl.corner{z-index:4;top:0;background:var(--surface2);cursor:default;justify-content:flex-end;color:var(--ink3);font-size:11.5px;height:auto}
.gc{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;line-height:1.2;text-align:center;position:relative;min-height:42px;cursor:pointer;font-variant-numeric:tabular-nums}
.gc.we:not(.g-roast):not(.g-prod):not(.g-grind):not(.g-degas){background:var(--surface2)}
.gh.today{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.gc.today::after{content:"";position:absolute;inset:0;border-left:2px solid var(--accent);border-right:2px solid var(--accent);pointer-events:none}
.gh.today{background:var(--accent-soft);color:var(--ink)}
.g-roast{background:var(--is);color:var(--on);font-weight:700}
.g-degas{background:repeating-linear-gradient(135deg,var(--ib) 0 6px,color-mix(in srgb,var(--id) 24%,var(--surface)) 6px 12px)}
.g-grind{background:var(--surface);color:var(--if);font-weight:700;box-shadow:inset 0 0 0 2px var(--is)}
.g-prod{background:var(--ib);color:var(--if);font-weight:700;box-shadow:inset 0 3px 0 var(--id),inset 0 -3px 0 var(--id)}
.g-prod.g-over{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.tg{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:3px;padding:0 4px;line-height:14px;white-space:nowrap;z-index:1}
.tg.k{background:var(--is);color:var(--on)}
.gc.hastag{min-height:52px}
.gc.hastag .tx{margin-top:8px}
.gc.hastag .tx{margin-top:12px}
.gsum{background:var(--surface2);font-size:11.5px}
.gsum.gl{background:var(--surface2);font-weight:700}
.gsum.gc{cursor:pointer;align-items:stretch;justify-content:flex-end;padding:3px}
.gsum .bx{height:20px;display:flex;align-items:flex-end}
.gsum .bx i{display:block;width:100%;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px}
.gsum .bx i.r{background:var(--ink3)}
.gsum .bx i.over{background:var(--warn)}
.gsum .tx{text-align:center;font-weight:700;margin-top:2px}
.gsum .tx.over{color:var(--warn)}
.gdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.gdots i{width:8px;height:8px;border-radius:50%;background:var(--ink2);display:block}

/* 목록 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:15px;font-weight:700}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.itemcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--surface2)}
.itemcard b{font-size:14px}
.itemcard .m{font-size:12px;color:var(--ink2)}
.itemcard .q{font-size:18px;font-weight:700}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th{font-size:11.5px;color:var(--ink3);text-align:left;font-weight:500;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tr[data-a]{cursor:pointer}
tr[data-a]:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;background:var(--c-bg,var(--etc-bg));color:var(--c-fg,var(--etc-fg))}
.st0{--c-bg:var(--etc-bg);--c-fg:var(--etc-fg)}
.st1{--c-bg:var(--roast-bg);--c-fg:var(--roast-fg)}
.st2{--c-bg:var(--recv-bg);--c-fg:var(--recv-fg)}
.st3{--c-bg:var(--prod-bg);--c-fg:var(--prod-fg)}
.st4{--c-bg:var(--prod-dot);--c-fg:#fff}
select.stsel{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 6px;font-size:12.5px}
.wflag{color:var(--warn);font-weight:700;font-size:12px}
.evlist{display:flex;flex-direction:column;gap:6px}
.evrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);text-align:left;width:100%}
.evrow .when{font-size:12.5px;font-weight:700;min-width:84px}
.evrow .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evrow.done .tt{text-decoration:line-through;color:var(--ink3)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-size:16px;color:var(--ink)}

/* 상세 패널 */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer .dhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 12px 18px;border-bottom:1px solid var(--line)}
.drawer .dhd small{color:var(--ink3);font-size:12px}
.drawer .dhd h2{margin:0;font-size:19px;font-weight:700;line-height:1.3}
.drawer .dbd{padding:14px max(18px,env(safe-area-inset-right,0px)) 14px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.drawer .dft{padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{border:0;background:transparent;font-size:22px;line-height:1;padding:4px 8px;color:var(--ink2);border-radius:6px}
.xbtn:hover{background:var(--surface2)}
.sec h4{margin:0 0 6px;font-size:12.5px;color:var(--c-fg,var(--ink2));display:flex;align-items:center;gap:6px;font-weight:700}
.sec h4 .dot{width:9px;height:9px;border-radius:50%;background:var(--c-dot)}
.rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;text-align:left;width:100%}

body{margin:0;min-height:100vh}
[hidden]{display:none!important}
img{max-width:100%}
.lgwrap{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lgbox{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.lgbox h1{margin:0 0 2px;font-size:20px}
.lgsub{margin:0 0 8px;color:var(--ink2);font-size:13px}
.lgbox label{font-size:12.5px;color:var(--ink2);font-weight:500;margin-top:4px}
.lgbox input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px}
.lgbox .btn{justify-content:center;margin-top:8px;min-height:42px;font-size:14px}
.lgerr{color:var(--warn);font-size:12.5px;margin:4px 0 0}
.lghint{color:var(--ink3);font-size:12px;margin:6px 0 0}
.uchip{display:inline-flex;gap:2px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;font-size:12.5px;margin-right:4px}
.uchip button{border:0;background:transparent;color:var(--ink2);font-size:12px;padding:4px 8px;border-radius:999px}
.uchip button:hover{background:var(--surface2);color:var(--ink)}
.umodal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.uscrim{position:absolute;inset:0;background:rgba(10,20,15,.4)}
.ubox{position:relative;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(720px,100%);max-height:88vh;overflow:auto}
.uhd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.uhd h2{margin:0;font-size:17px}
.ubd{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.uform{display:flex;flex-direction:column;gap:10px}
.uform.row{flex-direction:row;flex-wrap:wrap;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.uform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);min-width:140px;flex:1}
.uform input,.uform select,.utable select,.inpw{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13.5px}
.utable{width:100%;min-width:0;border-collapse:collapse;font-size:13px}
.utable td,.utable th{white-space:normal}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shim.js"></script>
<script>
(function(){
'use strict';
/* ───────── 기준값 (엑셀 일정표의 전제) ───────── */
var CAP_PROD=16800, CAP_ROAST=400, GRIND_DAY=8, LAST_DAY=9; // 분쇄마감 9일차 = 로스팅일+8, 생산마감 10일차 = 로스팅일+9
var TYPES={
  roast:{label:'로스팅',cls:'t-roast'}, recv:{label:'뉴지 입고',cls:'t-recv'}, grind:{label:'분쇄마감',cls:'t-grind'},
  prod:{label:'티백 생산',cls:'t-prod'}, degas:{label:'디게싱',cls:'t-degas'},
  meet:{label:'협의·회의',cls:'t-meet'}, deliv:{label:'납품·출고',cls:'t-deliv'}, mat:{label:'자재 입고',cls:'t-mat'},
  qc:{label:'검수·품질',cls:'t-qc'}, etc:{label:'기타',cls:'t-etc'}
};
var CUSTOM=['meet','deliv','mat','qc','etc'];
var STATUS=['예정','로스팅 완료','입고 완료','생산 중','완료'];
var HOLI={'2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절','2027-01-01':'신정'};
var DOWK=['일','월','화','수','목','금','토'];

/* ───────── 날짜 도구 (문자열 YYYY-MM-DD, UTC 계산) ───────── */
function pad(n){return String(n).padStart(2,'0')}
function P(s){var a=s.split('-').map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]))}
function F(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function add(s,n){var d=P(s);d.setUTCDate(d.getUTCDate()+n);return F(d)}
function dow(s){return P(s).getUTCDay()}
function md(s){var d=P(s);return (d.getUTCMonth()+1)+'/'+d.getUTCDate()}
function mdw(s){return md(s)+'('+DOWK[dow(s)]+')'}
function diff(a,b){return Math.round((P(a)-P(b))/864e5)}
function today(){var n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())}
function ym(s){return s.slice(0,7)}
function nf(n){return Number(n||0).toLocaleString('ko-KR')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dday(s){var n=diff(s,today());return n===0?'D-Day':n>0?'D-'+n:Math.abs(n)+'일 지남'}
function isWeekend(s){var w=dow(s);return w===0||w===6}
function itemShort(it){return String(it||'').replace(/\s?\d+개입/,'').trim()}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function num(v){var n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0}

/* ───────── 상태 ───────── */
var S={calcQ:{},calcLoss:true,calcPlan:true,calcAll:false,gLast:{},subG:'all',selMat:null,rawAll:false,logMat:'all',mRange:'open',sim:{item:'',qty:'',roast:''},aFrom:'',aTo:'',aQ:'',aSt:'all',aLimit:100,showPast:false,view:'month',hQ:'',hC:'all',month:ym(today()),itemF:'all',typeOff:{},loaded:{b:false,e:false},mode:'mem',readonly:false};
var MATS=[],CAPPM={},BATCHES=[],EVENTS=[],DB=null,DOWN=null,drawer=null,draft=null,IDX={},FLAGS=[],XL=null;
try{var sv=JSON.parse(localStorage.getItem('newji-ui')||'{}');if(sv.view)S.view=sv.view==='mat'?'sub':(sv.view==='home'||sv.view==='actual')?'month':sv.view;if(sv.gLast&&sv.gLast.home)delete sv.gLast.home;if(sv.gLast)S.gLast=sv.gLast;if(sv.subG)S.subG=sv.subG;if(sv.month)S.month=sv.month;if(sv.typeOff)S.typeOff=sv.typeOff;}catch(e){}
try{S.calcQ=JSON.parse(localStorage.getItem('newji-calc')||'{}')||{}}catch(e){}
function saveUI(){try{localStorage.setItem('newji-ui',JSON.stringify({gLast:S.gLast,subG:S.subG,view:S.view,month:S.month,typeOff:S.typeOff}))}catch(e){}}

/* ───────── 저장소 어댑터 ───────── */
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function memArr(c){return c==='batches'?BATCHES:c==='materials'?MATS:c==='orders'?ORDERS:c==='receipts'?RECEIPTS:c==='beans'?BEANS:c==='products'?PRODUCTS:EVENTS}
function snapOld(c,id){if(!COLL_K[c])return null;var o=memArr(c).find(function(x){return x.id===id});return o?JSON.parse(JSON.stringify(o)):null}
async function put(c,id,data){
  var old=snapOld(c,id);
  try{
    if(DB){await DB.collection(c).doc(id).set(data)}
    else{var a=memArr(c),i=a.findIndex(function(x){return x.id===id}),o=Object.assign({id:id},data);if(i>=0)a[i]=o;else a.push(o);}
    logChange(old?'수정':'추가',c,id,old,data);return true;
  }catch(e){toast('저장하지 못했습니다. 권한을 확인해 주세요.');return false}
}
async function patch(c,id,data){
  var old=snapOld(c,id);
  try{
    if(DB){await DB.collection(c).doc(id).update(data)}
    else{var o=memArr(c).find(function(x){return x.id===id});if(o)Object.assign(o,data);}
    if(old)logChange('수정',c,id,old,Object.assign({},old,data));return true;
  }catch(e){toast('저장하지 못했습니다. 권한을 확인해 주세요.');return false}
}
async function del(c,id){
  var old=snapOld(c,id);
  try{
    if(DB){await DB.collection(c).doc(id).delete()}
    else{var a=memArr(c),i=a.findIndex(function(x){return x.id===id});if(i>=0)a.splice(i,1);}
    logChange('삭제',c,id,old,null);return true;
  }catch(e){toast('삭제하지 못했습니다.');return false}
}
function sortB(){BATCHES.sort(function(a,b){return (a.roast||'').localeCompare(b.roast||'')||String(a.item).localeCompare(String(b.item))||String(a.bean).localeCompare(String(b.bean))||String(a.id).localeCompare(String(b.id))})}
function normItem(it){var b=String(it==null?'':it).replace(/\s*\(?\d+\s*차\)?\s*$/,'').trim();if(b&&typeof PRODUCTS!=='undefined'&&PRODUCTS.length){var k=b.replace(/티백/g,'').replace(/\s/g,''),p=PRODUCTS.find(function(x){return x.name===b})||PRODUCTS.find(function(x){return String(x.name).replace(/\s*\d+차\s*$/,'').replace(/티백/g,'').replace(/\s/g,'')===k});if(p)return String(p.name).trim()}return b}
var CANON={};
function canonPass(){if(!PRODUCTS.length)return;var w=!S.readonly&&DB,jobs=[];
  BATCHES=BATCHES.map(function(b){var n=normItem(b.item);if(n===b.item)return b;var nb=Object.assign({},b,{item:n});if(w&&!CANON['b'+b.id]){CANON['b'+b.id]=1;var doc=Object.assign({},nb);delete doc.id;jobs.push(['batches',b.id,doc])}return nb});
  ORDERS=ORDERS.map(function(o){if(!(o.lines||[]).some(function(l){return normItem(l.item)!==l.item}))return o;var no=Object.assign({},o,{lines:mergeLines(o.lines)});if(w&&!CANON['o'+o.id]){CANON['o'+o.id]=1;var doc=Object.assign({},no);delete doc.id;jobs.push(['orders',o.id,doc])}return no});
  RECEIPTS=RECEIPTS.map(function(r){if(!(r.rows||[]).some(function(x){return normItem(x.item)!==x.item}))return r;var nr=Object.assign({},r,{rows:(r.rows||[]).map(function(x){return Object.assign({},x,{item:normItem(x.item)})})});if(w&&!CANON['r'+r.id]){CANON['r'+r.id]=1;var doc=Object.assign({},nr);delete doc.id;jobs.push(['receipts',r.id,doc])}return nr});
  MATS=MATS.map(function(m){var mp=m.per||{};if(!Object.keys(mp).some(function(k){return normItem(k)!==k}))return m;var o={};Object.keys(mp).forEach(function(k){if(normItem(k)===k)o[k]=mp[k]});Object.keys(mp).forEach(function(k){var nk=normItem(k);if(nk!==k&&!(nk in o))o[nk]=mp[k]});var nm=Object.assign({},m,{per:o});if(w&&!CANON['m'+m.id]){CANON['m'+m.id]=1;var doc=Object.assign({},nm);delete doc.id;delete doc.ship;jobs.push(['materials',m.id,doc])}return nm});
  if(jobs.length)(async function(){for(var i=0;i<jobs.length;i++){try{await DB.collection(jobs[i][0]).doc(jobs[i][1]).set(jobs[i][2])}catch(e){}}})();
}
function roundOf(it){var m=String(it||'').match(/(\d+)\s*차\)?\s*$/);return m?m[1]+'차':''}
function mergeLines(ls){var o=[],ix={};(ls||[]).forEach(function(l){var it=normItem(l.item);if(it in ix){o[ix[it]].sets=num(o[ix[it]].sets)+num(l.sets)}else{ix[it]=o.length;o.push(Object.assign({},l,{item:it}))}});return o}
var MIG={};
function migRun(k,list,fix){if(MIG[k]||S.readonly||!DB)return;var todo=list.filter(function(x){return fix(x,true)});MIG[k]=true;if(!todo.length)return;
  (async function(){for(var i=0;i<todo.length;i++){var x=todo[i],doc=fix(x,false);if(doc)try{await DB.collection(k).doc(x.id).set(doc)}catch(e){}}})()}
function itemIdx(it){
  var s=String(it||'');
  if(/버라이어티/.test(s))return 0;
  if(/달항아리/.test(s))return 1;
  var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return 3+h%3;
}
function ic(it){return 'i'+itemIdx(it)}
function groupItems(list,get){var m={},o=[];list.forEach(function(x){var k=get(x).item;if(!m[k]){m[k]=[];o.push(k)}m[k].push(x)});return o.map(function(k){return {item:k,list:m[k]}})}
function kgSum(l){return nf(Math.round(l.reduce(function(s,b){return s+(b.kg||0)},0)*10)/10)}
function legendHTML(kind){
  var its=Object.keys(items()),h='<div class="legend"><span class="lt">품목 색</span>'+its.map(function(it){return '<span class="lgi '+ic(it)+'"><i class="sw"></i>'+esc(it)+'</span>'}).join('');
  if(kind==='gantt')h+='<span class="sepv"></span><span class="lt">칸 모양</span><span class="lgi i0"><i class="sw2 g-roast">로스팅</i></span><span class="lgi i0"><i class="sw2 g-degas"></i>디게싱(숙성)</span><span class="lgi i0"><i class="sw2 g-prod"></i>티백 생산(개수)</span><span class="lgi i0"><i class="sw2 g-grind"></i>분쇄마감(9일차)</span><span class="lgi"><i class="tg2">입고</i>뉴지 입고</span><span class="lgi"><i class="sw2 g-prod g-over"></i>10일차 초과</span>';
  else h+='<span class="sepv"></span><span class="hint">색은 품목, 글자는 공정입니다 (로스팅 → 뉴지 입고 → 분쇄마감 → 티백 생산). 점선 칸은 협의·납품 등 기타 일정.</span>';
  return h+'</div>';
}


/* ───────── 계산 ───────── */
function items(){var m={};BATCHES.forEach(function(b){(m[b.item]=m[b.item]||[]).push(b)});return m}
function visBatches(){return BATCHES.filter(function(b){return S.itemF==='all'||b.item===S.itemF})}
function cutoff(){return add(today(),-30)}
function endOf(b){var m=b.roast||'';[b.end,b.grind,b.recv].forEach(function(d){if(d&&d>m)m=d});Object.keys(b.daily||{}).forEach(function(d){if(d>m)m=d});return m}
function recent(b){return S.showPast||(b.status||'예정')!=='완료'||endOf(b)>=cutoff()}
function recentEv(e){return S.showPast||!e.done||(e.endDate||e.date||'')>=cutoff()}
function curBatches(){return visBatches().filter(recent)}
function activeItems(){var m={};BATCHES.filter(recent).forEach(function(b){(m[b.item]=m[b.item]||[]).push(b)});return m}
function hiddenNote(){var n=visBatches().length-curBatches().length;return n>0&&!S.showPast?'<div class="legend"><span class="hint">완료 후 30일이 지난 생산 일정 '+n+'건은 숨겨져 있습니다.</span><button class="btn sm" data-a="view" data-v="archive">누적 현황에서 보기</button></div>':''}
function ymd(s){return s?s.slice(2).replace(/-/g,'.')+'('+DOWK[dow(s)]+')':'-'}
function ymLabel(m){return m.slice(0,4)+'년 '+Number(m.slice(5))+'월'}
function beansOf(list){var u=[];list.forEach(function(b){if(u.indexOf(b.bean)<0)u.push(b.bean)});return u}
function beansTxt(list){var u=beansOf(list);return u.length>2?u.slice(0,2).join('·')+' 외'+(u.length-2):u.join('·')}
function itemsTxt(list){var u=[];list.forEach(function(b){var s=itemShort(b.item);if(u.indexOf(s)<0)u.push(s)});return u.join('/')}
function doneQty(b){
  var as=actSum(b);if(as!=null)return as;
  if(b.status==='완료')return b.qty||0;
  if(b.status==='생산 중'){var t=today(),s=0;Object.keys(b.daily||{}).forEach(function(d){if(d<=t)s+=b.daily[d]});return Math.min(s,b.qty||s)}
  return 0;
}
function buildIndex(){
  var ix={};
  function g(d){return ix[d]||(ix[d]={roast:[],recv:[],grind:[],prod:[],degas:[],ev:[]})}
  visBatches().forEach(function(b){
    if(b.roast)g(b.roast).roast.push(b);
    if(b.recv)g(b.recv).recv.push(b);
    if(b.grind)g(b.grind).grind.push(b);
    var daily=b.daily||{};
    Object.keys(daily).forEach(function(d){g(d).prod.push({b:b,q:daily[d]})});
    if(b.roast&&b.grind){for(var d=add(b.roast,1);d<b.grind;d=add(d,1)){if(!daily[d])g(d).degas.push(b)}}
  });
  EVENTS.forEach(function(e){
    if(!e.date)return;
    var end=e.endDate&&e.endDate>=e.date?e.endDate:e.date;
    for(var d=e.date,n=0;d<=end&&n<60;d=add(d,1),n++){g(d).ev.push(e)}
  });
  IDX=ix;
}
function computeFlags(){
  var f=[],roastKg={},prodSum={};
  BATCHES.forEach(function(b){
    if(b.roast)roastKg[b.roast]=(roastKg[b.roast]||0)+(b.kg||0);
    var sum=0,daily=b.daily||{};
    Object.keys(daily).forEach(function(d){
      sum+=daily[d];prodSum[d]=(prodSum[d]||0)+daily[d];
      if(b.roast&&d>add(b.roast,LAST_DAY))f.push({sev:2,id:b.id,date:d,msg:'10일차 초과 생산',sub:b.item+' '+b.bean+' · '+mdw(d)+' 생산 (마감 '+mdw(add(b.roast,LAST_DAY))+')'});
      if(isWeekend(d))f.push({sev:1,id:b.id,date:d,msg:'주말 생산',sub:b.item+' '+b.bean+' · '+mdw(d)});
      else if(HOLI[d])f.push({sev:1,id:b.id,date:d,msg:'공휴일 생산',sub:b.item+' '+b.bean+' · '+mdw(d)+' '+HOLI[d]});
    });
    if(b.qty&&Object.keys(daily).length&&sum!==b.qty)f.push({sev:1,id:b.id,date:b.start||b.roast,msg:'계획 수량과 일별 합계 불일치',sub:b.item+' '+b.bean+' · 계획 '+nf(b.qty)+' / 일별 '+nf(sum)});
    if(b.grind&&b.roast&&b.grind>add(b.roast,GRIND_DAY))f.push({sev:1,id:b.id,date:b.grind,msg:'분쇄마감이 9일차 이후',sub:b.item+' '+b.bean+' · '+mdw(b.grind)});
  });
  Object.keys(prodSum).forEach(function(d){if(prodSum[d]>CAP_PROD)f.push({sev:2,date:d,msg:'일 생산 한도 초과',sub:mdw(d)+' · '+nf(prodSum[d])+'개 (한도 '+nf(CAP_PROD)+')'})});
  Object.keys(roastKg).forEach(function(d){if(roastKg[d]>CAP_ROAST)f.push({sev:2,date:d,msg:'일 로스팅 한도 초과',sub:mdw(d)+' · '+nf(Math.round(roastKg[d]*10)/10)+'kg (한도 '+CAP_ROAST+'kg)'})});
  f.sort(function(a,b){return b.sev-a.sev||String(a.date).localeCompare(String(b.date))});
  FLAGS=f;
}
function flagDates(){var m={};FLAGS.forEach(function(x){if(x.date)m[x.date]=1});return m}

/* ───────── 렌더: 공통 ───────── */
function render(){OD_CACHE=null;
  buildIndex();computeFlags();
  var h='';
  h+=headerHTML();
  if(!DB&&S.loaded.b&&S.mode==='mem')h+='<div class="notice">저장소에 연결되지 않아 이 화면의 변경 내용은 저장되지 않습니다. 페이지를 새로 열면 사라집니다.</div>';
  if(!S.loaded.b){h+='<div class="empty"><b>일정을 불러오는 중입니다</b></div>'}
  else if(!BATCHES.length&&!EVENTS.length){
    h+='<div class="empty"><b>등록된 일정이 없습니다</b><span>뉴지코리아 로스팅·생산 달력 엑셀을 가져오거나, 생산 일정을 직접 추가해 시작하세요.</span><div class="actions"><button class="btn primary" data-a="import">엑셀 가져오기</button><button class="btn" data-a="newbatch">생산 일정 직접 추가</button></div></div>';
  } else {
    h+=navHTML();h+=groupOf(S.view)==='sched'?tilesHTML():statusStrip();h+=toolsHTML();
    h+=S.view==='actual'?actualHTML():S.view==='hist'?histHTML():S.view==='month'?monthHTML():S.view==='gantt'?ganttHTML():S.view==='archive'?archiveHTML():S.view==='calc'?calcHTML():S.view==='raw'?rawHTML():S.view==='sub'?subHTML():S.view==='order'?orderHTML():S.view==='cap'?capHTML():listHTML();
  }
  document.getElementById('app').innerHTML=h;
  if(S.view==='gantt'&&S.loaded.b)ganttScroll();
}

function chipsFor(d){
  var x=IDX[d]||{roast:[],recv:[],grind:[],prod:[],degas:[],ev:[]},out=[],off=S.typeOff;
  if(!off.ev)x.ev.slice().sort(function(a,b){return (a.time||'99').localeCompare(b.time||'99')}).forEach(function(e){
    out.push({cls:'ev',label:(e.time?e.time+' ':'')+e.title,sub:(TYPES[e.type]||TYPES.etc).label+(e.contact?' · '+e.contact:''),id:e.id,done:e.done,title:(TYPES[e.type]||TYPES.etc).label+' · '+e.title+(e.contact?' · '+e.contact:'')});
  });
  function proc(key,label,subf){
    if(off[key]||!x[key].length)return;
    groupItems(x[key],function(b){return b}).forEach(function(g){out.push({cls:ic(g.item),label:label,text:beansTxt(g.list),sub:subf(g),title:label+' · '+g.item+' · '+beansOf(g.list).join(', ')})});
  }
  proc('roast','로스팅',function(g){return g.item+' · '+kgSum(g.list)+'kg'});
  proc('recv','뉴지 입고',function(g){return g.item});
  proc('grind','분쇄마감',function(g){return g.item});
  if(!off.prod&&x.prod.length)groupItems(x.prod,function(p){return p.b}).forEach(function(g){
    var q=g.list.reduce(function(s,p){return s+p.q},0);
    out.push({cls:ic(g.item),label:'생산 '+nf(q),text:beansTxt(g.list.map(function(p){return p.b})),sub:g.item,fill:Math.min(100,Math.round(q/CAP_PROD*100)),title:'티백 생산 '+nf(q)+'개 · '+g.item});
  });
  return out;
}

    var st=orderStats(o),lines=[];st.forEach(function(x){var un=Math.max(0,x.sets-x.plan);if(un>0)lines.push({item:x.item,sets:un})});if(!lines.length)return;
    var bags=lines.reduce(function(a,l){return a+l.sets*packOf(l.item)},0),days=Math.ceil(bags/CAP_PROD);

function projection(m,excl){
  var t=today(),ev=[],bal=0,L=null;
  if(m.basis==='gram'){
    BATCHES.forEach(function(b){if(excl&&excl[b.id])return;if(b.recv&&usesFor(m,b.item,b.bean))ev.push([b.recv,0,shipKgOf(b)])});
    BATCHES.forEach(function(b){if(excl&&excl[b.id])return;var dl=b.daily||{};Object.keys(dl).forEach(function(d){var v=matNeed(m,b.item,dl[d],b.bean);if(v)ev.push([d,1,-v])})});
    ev.sort(function(a,b){return a[0].localeCompare(b[0])||a[1]-b[1]});
    var est=0,cur=null,short=null,need=0,inF=0,series=[[t,0]];
    ev.forEach(function(e){if(cur===null&&e[0]>t)cur=est;est+=e[2];if(e[0]>t){if(e[2]<0)need-=e[2];else inF+=e[2]}if(short==null&&e[1]===1&&est<-1e-6)short=e[0];series.push([e[0],est])});
    if(cur===null)cur=est;
    return {est:cur,need:need,inF:inF,after:est,short:short,series:series,hist:null,lastCnt:null,auto:true};
  }
  // 부자재: 등록된 생산 일정·발주는 등록 시점에 전부 소모된 것으로 본다 (시트 잔여 회신은 일정 시작 전 마지막 것만 출발점으로 사용)
  L=ledger(m);if(!L.rows.length)return {none:true,hist:null,lastCnt:null};
  var prod=[];
  BATCHES.forEach(function(b){if(excl&&excl[b.id])return;var dl=b.daily||{};Object.keys(dl).forEach(function(d){var v=matNeed(m,b.item,dl[d],b.bean);if(v)prod.push([d,v])})});
  if(!(excl&&excl.__noOrders))orderDemand().forEach(function(e){if(excl&&excl.__oid===e.oid)return;var v=0;if(m.scope==='bean'){Object.keys(e.beans).forEach(function(b){v+=matNeed(m,e.item,e.beans[b],b)})}else v=matNeed(m,e.item,e.bags);if(v)prod.push([e.d,v])});
  var first=null;prod.forEach(function(p){if(!first||p[0]<first)first=p[0]});
  var base=null,ign=0,ins=0;
  L.rows.forEach(function(r){if(r.t==='cnt'&&(!first||r.d<first))base=r});
  if(base)bal=base.bal;
  L.rows.forEach(function(r){var after=base?(r.d>base.d||(r.d===base.d&&r.i>base.i)):true;if(!after)return;if(r.t==='in'){ins+=r.q;ev.push([r.d,0,r.q])}else ign++});
  var need=0;prod.forEach(function(p){need+=p[1];ev.push([p[0],1,-p[1]])});
  ev.sort(function(a,b){return a[0].localeCompare(b[0])||a[1]-b[1]});
  var run=bal,short=null,series=[[base?base.d:(L.first||t),bal]];
  ev.forEach(function(e){run+=e[2];if(short==null&&e[1]===1&&run<-1e-6)short=e[0];series.push([e[0],run])});
  var after=bal+ins-need;
  return {est:after,need:need,inF:0,after:after,short:short,series:series,hist:L.hist,lastCnt:base?base.d:null,auto:false,sched:true,base:base?base.q:null,ins:ins,ign:ign,firstProd:first};
}

    var bs=BATCHES.filter(function(b){return b.order===o.id&&b.item===l.item}),pk=packOf(l.item);

function compSum(p){return Object.keys(p.comp||{}).reduce(function(s,k){return s+num(p.comp[k])},0)}

function perForProduct(m,p){
  var mp=m.per||{};if(num(mp[p.name]))return num(mp[p.name]);
  var b=nameKey(p.name),ks=Object.keys(mp);for(var i=0;i<ks.length;i++){if(nameKey(ks[i])===b&&num(mp[ks[i]]))return num(mp[ks[i]])}
  return 0;
}
function calcNeed(m,p,sets,useLoss){
  var lossF=useLoss?1+num(m.loss)/100:1,v=0,comp=p.comp||{};
  if(!sets)return 0;
  if(m.scope==='bean'){Object.keys(comp).forEach(function(b){var per=num((m.perBean||{})[b]);if(per)v+=sets*num(comp[b])*per})}
  else{var per=perForProduct(m,p);if(!per)return 0;
    if(m.basis==='perMat'){var lm=MATS.find(function(x){return x.id===m.link});if(!lm||lm.id===m.id||lm.basis==='perMat')return 0;return calcNeed(lm,p,sets,false)*per*lossF}
    var bags=sets*num(p.pack);
    if(m.basis==='gram')v=bags*per/1000;else if(m.basis==='set')v=sets*per;else if(m.basis==='perSets')v=sets/per;else v=bags*per}
  return v*lossF;
}

function calcUses(m,p){if(m.scope==='bean')return Object.keys(p.comp||{}).some(function(b){return num((m.perBean||{})[b])>0});if(m.basis==='perMat'){var lm=MATS.find(function(x){return x.id===m.link});return perForProduct(m,p)>0&&!!lm&&calcUses(lm,p)}return perForProduct(m,p)>0}

    if(compSum(p)!==num(p.pack))miss.push({k:'prod',id:p.id,t:p.name+' 세트 구성 확인 필요',s:'원두별 개수 합계('+compSum(p)+')가 '+p.pack+'개입과 다릅니다.'});
    Object.keys(p.comp||{}).forEach(function(b){beanBags[b]=(beanBags[b]||0)+n*num(p.comp[b]);beanBy[b]=beanBy[b]||{};beanBy[b][p.id]=(beanBy[b][p.id]||0)+n*num(p.comp[b])})});
  var bm=beanMat(),rows=[];

function archiveResHTML(){
  var from=S.aFrom||'0000-00',to=S.aTo||'9999-99',q=(S.aQ||'').trim().toLowerCase();
  function inR(m){return m>=from&&m<=to}
  var bs=BATCHES.filter(function(b){
    if(S.itemF!=='all'&&b.item!==S.itemF)return false;
    if(S.aSt!=='all'&&(b.status||'예정')!==S.aSt)return false;
    if(q&&(b.item+' '+b.bean+' '+(b.memo||'')).toLowerCase().indexOf(q)<0)return false;
    return Object.keys(b.daily||{}).concat([b.roast,b.recv,b.grind]).filter(Boolean).some(function(d){return inR(ym(d))});
  });
  var evs=EVENTS.filter(function(e){
    if(!e.date||!inR(ym(e.date)))return false;
    if(S.aSt!=='all')return false;
    return !q||(e.title+' '+(e.contact||'')+' '+(e.memo||'')).toLowerCase().indexOf(q)>=0;
  });
  var months={},its=[];
  function mo(m){return months[m]||(months[m]={q:{},tot:0,kg:0,ev:0})}
  bs.forEach(function(b){
    if(its.indexOf(b.item)<0)its.push(b.item);
    Object.keys(b.daily||{}).forEach(function(d){var m=ym(d);if(inR(m)){var o=mo(m);o.q[b.item]=(o.q[b.item]||0)+b.daily[d];o.tot+=b.daily[d]}});
    if(b.roast&&inR(ym(b.roast)))mo(ym(b.roast)).kg+=b.kg||0;
  });
  evs.forEach(function(e){mo(ym(e.date)).ev++});
  var ml=Object.keys(months).sort().reverse(),totQ=0,totKg=0;
  ml.forEach(function(m){totQ+=months[m].tot;totKg+=months[m].kg});
  var h='<div class="tiles">'+
   '<div class="tile"><span class="k">기간 내 티백 생산 수량</span><span class="v num">'+nf(totQ)+'<small>개</small></span></div>'+
   '<div class="tile"><span class="k">기간 내 로스팅 원두량</span><span class="v num">'+nf(Math.round(totKg*10)/10)+'<small>kg</small></span></div>'+
   '<div class="tile"><span class="k">생산 일정</span><span class="v num">'+nf(bs.length)+'<small>건</small></span></div>'+
   '<div class="tile"><span class="k">협의·납품 등 일정</span><span class="v num">'+nf(evs.length)+'<small>건</small></span></div></div>';
  if(!bs.length&&!evs.length)return h+'<div class="empty"><b>조건에 맞는 자료가 없습니다</b><span>기간이나 검색어를 바꿔 보세요.</span></div>';
  // 월별 집계
  h+='<div class="panel"><div class="ph"><h3>월별 집계</h3><span class="hint">티백 수량은 생산일 기준, 원두량은 로스팅일 기준입니다. 행을 누르면 그 달 달력으로 이동합니다.</span></div><div class="tscroll"><table class="pivot"><thead><tr><th>월</th>'+
    its.map(function(it){return '<th class="r '+ic(it)+'"><i class="sw"></i> '+esc(it)+'</th>'}).join('')+'<th class="r">합계(개)</th><th class="r">원두(kg)</th><th class="r">협의·기타</th></tr></thead><tbody>';
  ml.forEach(function(m){var o=months[m];
    h+='<tr data-a="gomonth" data-m="'+m+'"><td class="num"><b>'+ymLabel(m)+'</b></td>'+its.map(function(it){return '<td class="r num">'+(o.q[it]?nf(o.q[it]):'<span class="hint">-</span>')+'</td>'}).join('')+'<td class="r num"><b>'+nf(o.tot)+'</b></td><td class="r num">'+(o.kg?nf(Math.round(o.kg*10)/10):'<span class="hint">-</span>')+'</td><td class="r num">'+(o.ev||'<span class="hint">-</span>')+'</td></tr>';
  });
  h+='<tr class="tot"><td>합계</td>'+its.map(function(it){var t=0;ml.forEach(function(m){t+=months[m].q[it]||0});return '<td class="r num">'+nf(t)+'</td>'}).join('')+'<td class="r num">'+nf(totQ)+'</td><td class="r num">'+nf(Math.round(totKg*10)/10)+'</td><td class="r num">'+evs.length+'</td></tr></tbody></table></div></div>';
  // 이력
  var sorted=bs.slice().sort(function(a,b){return (b.roast||'').localeCompare(a.roast||'')||String(a.item).localeCompare(String(b.item))||String(a.bean).localeCompare(String(b.bean))});
  var shown=sorted.slice(0,S.aLimit);
  h+='<div class="panel"><div class="ph"><h3>생산 일정 이력</h3><span class="hint">로스팅일이 최근인 순서 · '+nf(sorted.length)+'건</span></div><div class="tscroll"><table><thead><tr><th>품목</th><th>원두</th><th>로스팅</th><th>뉴지 입고</th><th>생산 기간</th><th>분쇄마감</th><th class="r">수량(개)</th><th>상태</th><th>메모</th></tr></thead><tbody>';
  shown.forEach(function(b){
    var ds=Object.keys(b.daily||{}).sort(),span=ds.length?ymd(ds[0]).slice(0,8)+' ~ '+ymd(ds[ds.length-1]).slice(0,8):'-';
    h+='<tr class="ic '+ic(b.item)+'" data-a="batch" data-id="'+esc(b.id)+'"><td>'+esc(b.item)+'</td><td>'+esc(b.bean)+'</td><td class="num">'+ymd(b.roast)+'</td><td class="num">'+ymd(b.recv)+'</td><td class="num">'+span+'</td><td class="num">'+ymd(b.grind)+'</td><td class="r num">'+nf(b.qty)+'</td><td><span class="pill st'+Math.max(0,STATUS.indexOf(b.status||'예정'))+'">'+esc(b.status||'예정')+'</span></td><td style="max-width:240px;overflow:hidden;text-overflow:ellipsis">'+esc(b.memo||'')+'</td></tr>';
  });
  h+='</tbody></table></div>'+(sorted.length>shown.length?'<button class="btn" data-a="amore">더 보기 ('+nf(sorted.length-shown.length)+'건 남음)</button>':'')+'</div>';
  // 기타 일정 이력
  if(evs.length){
    var es=evs.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,S.aLimit);
    h+='<div class="panel"><div class="ph"><h3>협의 · 납품 · 기타 일정 이력</h3><span class="hint">'+nf(evs.length)+'건</span></div><div class="evlist">'+es.map(function(e){var t=TYPES[e.type]||TYPES.etc;
      return '<button class="evrow ev'+(e.done?' done':'')+'" data-a="event" data-id="'+esc(e.id)+'"><span class="when num">'+ymd(e.date)+'</span><span class="pill">'+t.label+'</span><span class="tt">'+esc((e.time?e.time+' ':'')+e.title)+'</span>'+(e.contact?'<span class="hint">'+esc(e.contact)+'</span>':'')+'</button>'}).join('')+'</div></div>';
  }
  return h;
}

/* ───────── 엑셀 파싱 ───────── */
function serial(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return F(new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())));
  if(typeof v==='number'&&v>30000&&v<80000)return F(new Date(Math.round((v-25569)*864e5)));
  if(typeof v==='string'){var m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3]}
  return null;
}
function parseWB(wb){
  var rows=null,hi=-1;
  for(var k=0;k<wb.SheetNames.length&&hi<0;k++){
    var r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[k]],{header:1,raw:true,defval:null});
    for(var i=0;i<Math.min(r.length,20);i++){var c=(r[i]||[]).map(function(x){return String(x==null?'':x).replace(/\s/g,'')});if(c.indexOf('원두')>=0&&c.indexOf('로스팅일')>=0){rows=r;hi=i;break}}
  }
  if(hi<0)throw new Error('‘원두’와 ‘로스팅일’ 열이 있는 시트를 찾지 못했습니다. 로스팅·생산 달력 양식인지 확인해 주세요.');
  var hd=rows[hi].map(function(x){return String(x==null?'':x).replace(/\s/g,'')}),col={};
  hd.forEach(function(n,i){if(n&&!(n in col))col[n]=i});
  function ci(n){return col[n]!=null?col[n]:-1}
  var dateCols=[];rows[hi].forEach(function(v,i){var s=serial(v);if(s&&i>ci('점검'))dateCols.push([i,s])});
  var out=[],n=0;
  for(var i=hi+1;i<rows.length;i++){
    var r=rows[i]||[],a=String(r[0]==null?'':r[0]);
    if(/합계|범례/.test(a))break;
    var item=r[ci('품목')],bean=r[ci('원두')];
    if(!item||!bean)continue;
    var daily={};dateCols.forEach(function(dc){var v=r[dc[0]];if(typeof v==='number'&&v>0)daily[dc[1]]=v});
    var b={item:normItem(item),bean:String(bean).trim(),batches:num(r[ci('배치')]),kg:num(r[ci('원두량(kg)')]),qty:num(r[ci('생산(개)')]),
      roast:serial(r[ci('로스팅일')]),grind:serial(r[ci('분쇄마감')]),recv:serial(r[ci('입고일')]),start:serial(r[ci('생산착수')]),end:serial(r[ci('생산종료')]),lastGrind:serial(r[ci('마지막분쇄일')]),
      daily:daily,status:'예정',memo:''};
    if(!b.roast)continue;
    out.push(b);
  }
  if(!out.length)throw new Error('읽을 수 있는 생산 일정이 없습니다.');
  return {batches:out};
}

  if(!draft||!drawer)return;
